name: Build and Publish

on:
  push:
    branches:
      [ main ]
  pull_request:
    types: [ opened, synchronize, reopened ]
  schedule: ## Do a run daily, to refresh website content
    - cron: '0 3 * * *'
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: site

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: site/site-tests/package-lock.json
      - name: Build with Maven
        run: |
          export QUARKUS_ROQ_GENERATOR_BATCH=true
          mvn -B package quarkus:run -DskipTests
      - name: Install site test dependencies
        working-directory: site/site-tests
        run: npm ci
      # The tests start serve-roq.js themselves (see jest-puppeteer.config.js), so there is no server to start here
      - name: Integration tests
        working-directory: site/site-tests
        run: npm run test:int
        env:
          CI: true
      - name: Store PR id
        run: echo ${{ github.event.number }} > ./target/roq/pr-id.txt
      - name: Publishing directory for PR preview
        uses: actions/upload-artifact@v5
        with:
          name: site
          path: ./site/target/roq
          retention-days: 3
  deploy:
    # Only try and deploy on merged code
    if: "github.repository == 'quarkiverse/quarkiverse' && github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')"
    needs: [ build ]
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6 # not needed for the code, but needed for the git config
      - name: Download Built site
        uses: actions/download-artifact@v6
        with:
          name: site
          path: _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  check-external-links:
    # Only check external links on merged code
    needs: [ build ]
    runs-on: ubuntu-latest
    permissions:
      issues: write
      repository-projects: read
      statuses: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: site/site-tests/package-lock.json
      - name: Download Built Artifact
        uses: actions/download-artifact@v6
        with:
          path: ./site/target/roq/
          name: site
      - name: Install site test dependencies
        working-directory: site/site-tests
        run: npm ci --prefer-offline
      - run: npm run test:links
        working-directory: site/site-tests
        continue-on-error: true # problems will be tracked by defects raised by the next job, not by build failures
        env:
          CI: true
      - name: Raise defects if needed
        uses: jbangdev/jbang-action@v0.142.0
        if: "github.repository == 'quarkiverse/quarkiverse' && github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')"
        with:
          script: site/site-tests/site-validation/dead-link-issue.java
          scriptargs: token=${{ secrets.GITHUB_TOKEN }} issueRepo=${{ github.repository }}  runId=${{ github.run_id }} siteUrl=https://hub.quarkiverse.io/
